<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせフォーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
    <h1 class="title">札幌国際情報高校　購買予約確認サイト</h1>
    <nav class="nav">
        <ul class="menu-group">
        <li class="menu-item"><a href="index.html">ホーム</a></li>
        <li class="menu-item"><a href="zaikokakunin.html">在庫確認</a></li>
        <li class="menu-item"><a href="toiawase.html">お問い合わせ</a></li>
        </ul>
    </nav>
    </header>


 <div style="max-width: 800px; margin: 30px auto; padding: 20px; font-family: sans-serif; background-color: #fff;">
    <h2 style="font-size: 22px; margin-bottom: 20px; font-weight: bold; border-left: 5px solid #2b6cb0; padding-left: 10px; color: #333;">
        ⬜ お問い合わせフォーム
    </h2>

    <!-- 学年・クラス・出席番号（すっきり横並び） -->
    <div style="margin-bottom: 20px;">
        <label style="display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; color: #444;">学年・クラス・出席番号:</label>
        <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
            <!-- 学年プルダウン -->
            <select id="gakunenSelect" style="width: 130px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; background-color: #fff; font-size: 14px; height: 42px;">
                <option value="">学年</option>
                <option value="1年">1年</option>
                <option value="2年">2年</option>
                <option value="3年">3年</option>
            </select>

            <!-- クラスプルダウン -->
            <select id="classSelect" style="width: 130px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; background-color: #fff; font-size: 14px; height: 42px;">
                <option value="">クラス</option>
                <option value="1組">1組</option>
                <option value="2組">2組</option>
                <option value="3組">3組</option>
                <option value="4組">4組</option>
                <option value="5組">5組</option>
                <option value="6組">6組</option>
                <option value="7組">7組</option>
                <option value="8組">8組</option>
            </select>

            <!-- 出席番号入力欄（幅を固定してスッキリ） -->
            <div style="display: flex; align-items: center; gap: 6px;">
                <input type="number" id="numberInput" min="1" max="99"  style="width: 80px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; height: 20px; text-align: center;">
                <span style="font-size: 14px; color: #333; font-weight: bold;">番</span>
            </div>
        </div>
    </div>

    <!-- 氏名入力欄（横幅いっぱいに広げる） -->
    <div style="margin-bottom: 20px;">
        <label for="userName" style="display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; color: #444;">氏名:</label>
        <input type="text" id="userName" placeholder="例: 札情 太郎" style="width: 100%; max-width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;">
    </div>

    <!-- お問い合わせ内容（横幅いっぱいに広げ、高さを確保） -->
    <div style="margin-bottom: 25px;">
        <label for="toiawaseContent" style="display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; color: #444;">お問い合わせ内容:</label>
        <textarea id="toiawaseContent" placeholder="質問や不具合、暗証番号がロックされた等の連絡をここに記入してください" style="width: 100%; max-width: 100%; box-sizing: border-box; height: 150px; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; font-family: sans-serif; resize: vertical;"></textarea>
    </div>

    <!-- 送信ボタン（元の青色の横長ボタンを完全再現） -->
    <button id="submitBtn" class="btn-submit" style="width: 100%; padding: 14px; background-color: #0099e5; color: #fff; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.2s;">
        送信する
    </button>
</div>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBtLHgM6RzCU_grTElSqLCmsaRu4rVe-4o", 
        authDomain: "://firebaseapp.com", 
        projectId: "koubai-7b6a6", 
        storageBucket: "koubai-7b6a6.firebasetorage.app", 
        messagingSenderId: "934504714342", 
        appId: "1:934504714342:web:e160ada63fcfcd906c5da7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('submitBtn').addEventListener('click', async () => {
         const gakunen = document.getElementById('gakunenSelect').value;
        const className = document.getElementById('classSelect').value;
        const number = document.getElementById('numberInput').value.trim();
        const nameInput = document.getElementById('userName').value.trim();
        const contentInput = document.getElementById('toiawaseContent').value.trim();

        if (!gakunen || !className || !number || !nameInput || !contentInput) {
            alert("すべての項目を入力してください。");
            return;
        }

      const infoInput = `${gakunen}${className}${number}番`;

        try {
            // Firestoreの "enquiries" コレクションに問い合わせを保存
            await addDoc(collection(db, "enquiries"), {
                userKey: infoInput, // 合体した「3年5組41番」というデータがそのまま入ります
                name: nameInput,
                content: contentInput,
                createdAt: serverTimestamp()
            });

            alert("お問い合わせを送信しました！管理者が確認するまでお待ちください。");
            
            // 入力フォームをすべてリセット
            document.getElementById('gakunenSelect').value = "";
            document.getElementById('classSelect').value = "";
            document.getElementById('numberInput').value = "";
            document.getElementById('userName').value = "";
            document.getElementById('toiawaseContent').value = "";

        } catch (error) {
            console.error("問い合わせ送信エラー:", error);
            alert("送信に失敗しました。");
        }
    });
</script>
</body>
</html>
