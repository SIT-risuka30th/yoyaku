<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>札幌国際情報高校購買予約サイト・在庫表</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <header>
    <h1 class="title">札幌国際情報高校　購買予約確認サイト</h1>
    <nav class="nav">
        <ul class="menu-group">
        <li class="menu-item"><a href="index.html">ホーム</a></li>
        <li class="menu-item"><a href="zaiko.html">在庫確認</a></li>
        <li class="menu-item"><a href="toiawase.html">お問い合わせ</a></li>
        </ul>
    </nav>
    </header>

        <div id="table-container">
             <style>
            body { font-family: sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #f4f4f4; font-weight: bold; }
        tr:nth-child(even) { background-color: #fafafa; }
        .loading { color: #666; font-style: italic; }
    </style>
        <p class="loading">データを読み込み中...</p>
    </div>

<script>
   const SPREADSHEET_ID = "1lnttp4cb8prbuyngxin8wi25zkgdhmm3oij4u-tzmtw";
    const SHEET_NAME = "商品";

    // 確実にデータだけを引っこ抜くCSV形式のURLを構築
    const csvUrl = `https://google.com${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;

    (async function() {
        try {
            const response = await fetch(csvUrl);
            if (!response.ok) throw new Error('Googleからのデータ取得に失敗しました。');
            
            const csvText = await response.text();
            
            // CSVデータを2次元配列に変換
            const data = parseCSV(csvText);
            
            if (data.length === 0 || data[0].length === 0) {
                throw new Error('シートが空か、アクセス権がありません。共有設定が「リンクを知っている全員が閲覧可」になっているか再確認してください。');
            }

            // テーブルを描画
            renderTable(data);
        } catch (error) {
            console.error('エラー詳細:', error);
            document.getElementById('table-container').innerHTML = `<p class="error-msg">【エラー】${error.message}</p>`;
        }
    })();

    // 簡易CSVパース関数（クォーテーション対応）
    function parseCSV(text) {
        const lines = text.split(/\r\n|\n/);
        const result = [];
        for (let i = 0; i < lines.length; i++) {
            if (!lines[i]) continue;
            // カンマ区切りで分割（ダブルクォーテーションを考慮）
            const row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*\$)/).map(val => {
                return val.replace(/^"|"\$/g, '').trim(); // 前後の余計な"を消す
            });
            result.push(row);
        }
        return result;
    }

    // テーブルを描画する関数
    function renderTable(data) {
        let tableHtml = '<table>';
        
        // 1行目をヘッダー（見出し行）として処理
        const headerRow = data[0];
        tableHtml += '<thead><tr>';
        headerRow.forEach(cellText => {
            tableHtml += `<th>${cellText || ''}</th>`;
        });
        tableHtml += '</tr></thead><tbody>';
        
        // 2行目以降をデータとして処理
        for (let i = 1; i < data.length; i++) {
            tableHtml += '<tr>';
            data[i].forEach(cellText => {
                tableHtml += `<td>${cellText || ''}</td>`;
            });
            tableHtml += '</tr>';
        }
        
        tableHtml += '</tbody></table>';
        document.getElementById('table-container').innerHTML = tableHtml;
    }
</script>

</body>
</html>
