    <script>
        document.getElementById('saveBtn').addEventListener('click', () => {
            const nameValue = document.getElementById('nameInput').value;

            if(nameValue.trim()==''){
                alert("個数を入力してください");
                return;
            }
            
            localStorage.setItem('inputF3-2', nameValue);
            alert('入力を保存しました！');
        });

                const domainPart = "https://" + "docs." + "google.com";
        const sheetIdPart = "1XDmbBjMA3AwlaBiqVhovvMnNDv-elaaaNoHIWIbCZvI";
        const sheetNamePart = "0"; 

        const csvUrl = domainPart + "/spreadsheets/d/" + sheetIdPart + "/gviz/tq?tqx=out:csv&sheet=" + sheetNamePart;

        const targetRow = 6;
        const targetCol = 1;

       (async function() {
        try {
            const response = await fetch(csvUrl);
            if (!response.ok) throw new Error('Googleからのデータ取得に失敗しました。');
            
            const csvText = await response.text();
            
            // 【修正】どんなにカンマや改行が乱れていても、確実に1文字ずつ判定して2次元配列化するロジック
            const data = parseCSVAdvanced(csvText);
            
            if (data.length === 0) {
                throw new Error('シートが空か、アクセス権がありません。共有設定が「リンクを知っている全員が閲覧可」になっているか再確認してください。');
            }
        
            displaySingleCell(data,targetRow,targetCol);

        } catch (error) {
            console.error('エラー詳細:', error);
            document.getElementById('table-container').innerHTML = `<p class="error-msg">【エラー】${error.message}</p>`;
        }
    })();

    // 改良された高度なCSV切り分け関数
    function parseCSVAdvanced(text) {
        const lines = [];
        let row = [];
        let cell = '';
        let inQuotes = false;

        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            const nextChar = text[i + 1];

            if (inQuotes) {
                if (char === '"') {
                    if (nextChar === '"') { cell += '"'; i++; } 
                    else { inQuotes = false; }
                } else {
                    cell += char;
                }
            } else {
                if (char === '"') { inQuotes = true; }
                else if (char === ',') { row.push(cell.trim()); cell = ''; }
                else if (char === '\r' || char === '\n') {
                    row.push(cell.trim());
                    if (row.some(c => c !== '')) lines.push(row);
                    row = [];
                    cell = '';
                    if (char === '\r' && nextChar === '\n') { i++; } 
                } else {
                    cell += char;
                }
            }
        }
        if (cell || row.length > 0) {
            row.push(cell.trim());
            if (row.some(c => c !== '')) lines.push(row);
        }
        return lines;
    }

    function displaySingleCell(data,rowIdx,colIdx){
        if (data[rowIdx] && data[colIdx] !== undefined){
            const cellText = data[rowIdx][colIdx];
            document.getElementById('cell-value').innerText = cellText;
        } else{
            document.getElementById('cell-value').innerText = "指定されたセルにデータがありません";

        }
    }
    </script>
