<html lang="ja">

<body>

    <main>
    <div id="news-area" style="max-width: 800px; margin: 20px auto; padding: 0 15px; box-sizing: border-box; font-family: sans-serif;">
        <h2 style="font-size: 20px; color: #333; border-left: 5px solid #4169e1; padding-left: 10px; margin-bottom: 15px; text-align: left;">📢 購買からのお知らせ</h2>
        <div id="news-list-container" style="max-height:360px; overflow-y: auto; padding-right:5px;">
            <!-- ここに動的にお知らせのカードが追加されます -->

    <div class="fixed-button-container">
      <a href="foodhome.html" class="fixed-button">商品を予約する</a>

     <div class="footer-content">

    <br>札幌国際情報高校30期理数工学科</br></p>

<script type="module">
 // 既存のFirebaseインポートに以下を追加（Realtime Databaseの機能）
import {initializeApp}from"https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getDatabase, ref, set, push, onDisconnect } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";
import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { getFirestore, doc, updateDoc, increment, setDoc, getDoc, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const firebaseConfig = {
            apiKey: "AIzaSyBtLHgM6RzCU_grTElSqLCmsaRu4rVe-4o", 
            authDomain: "://firebaseapp.com", 
            projectId: "koubai-7b6a6", 
            storageBucket: "koubai-7b6a6.firebasetorage.app", 
            messagingSenderId: "934504714342", 
            appId: "1:934504714342:web:e160ada63fcfcd906c5da7"
        };

const app = initializeApp(firebaseConfig);
const rtdb = getDatabase(app);
const db = getFirestore(app); 
const auth = getAuth(app); 

let audioCtx = null;

// ==========================================
// 🔒 匿名ログイン状態を監視し、成功後に各機能を実行
// ==========================================
onAuthStateChanged(auth, async (user) => {
    if (user) {
        console.log("生徒側：接続の準備が整いました。UID:", user.uid);
        
        // 匿名ログインが完了した後に、すべての処理を安全に実行します
        trackPresence();
        countTodayView();
        listenNewsUpdates();

    } else {
        // ログインしていない場合は裏側で自動的に匿名ログイン
        try {
            await signInAnonymously(auth);
        } catch (error) {
            console.error("匿名接続に失敗しました:", error);
        }
    }
});

// --- 🌐 オンライン滞在者の記録機能 ---
function trackPresence() {
    const onlineUsersRef = ref(rtdb, 'online_users');
    const myUserRef = push(onlineUsersRef);

    // 1. ページを開いたとき：自分を追加
    set(myUserRef, true);

    // 2. ページを閉じたとき：自動的に削除する予約
    onDisconnect(myUserRef).remove();
}

// --- 📅 今日の訪問者数をカウントアップする機能 ---
async function countTodayView() {
    if (sessionStorage.getItem('counted_today')) return;

    const today = new Date().toISOString().split('T')[0];
    const todayDocRef = doc(db, "analytics", today);

    try {
        const docSnap = await getDoc(todayDocRef);
        if (docSnap.exists()) {
            await updateDoc(todayDocRef, { views: increment(1) });
        } else {
            await setDoc(todayDocRef, { views: 1 });
        }
        sessionStorage.setItem('counted_today', 'true');
    } catch (error) {
        console.error("今日の訪問者数カウントアップエラー:", error);
    }
}

// --- 📢 お知らせデータのリアルタイム取得 ---
function listenNewsUpdates() {
    const container = document.getElementById("news-list-container");
    if (!container) return;

    const newsQuery = query(collection(db, "news"), orderBy("date", "desc"));

    onSnapshot(newsQuery, (querySnapshot) => {
        container.textContent = "";

        if (querySnapshot.empty) {
            container.noNewsDiv = document.createElement("div");
                noNewsDiv.style.cssText = "background: #f8f9fa; padding: 20px; border-radius: 8px; text-align: center; color: #777; border: 1px dashed #ccc;";
                noNewsDiv.textContent = "現在、新しいお知らせはありません。";
                container.appendChild(noNewsDiv);
            return;
        }

        querySnapshot.forEach((newsDoc) => {
            const data = newsDoc.data();
            const body = data.body || "";
            
            const dateStr = data.date ? data.date.toDate().toLocaleDateString('ja-JP', {
                year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
            }) : "---";

            const cardDiv = document.createElement("div");
            cardDiv.className = "news-card";
            cardDiv.style.cssText = "background: #ffffff; padding: 15px 20px; border-radius: 8px; box-shadow: 2px 2px 6px rgba(0,0,0,0.08); border-left: 5px solid #4169e1; margin-bottom: 12px; text-align: left;";

            const dateDiv = document.createElement("div");
            dateDiv.style.cssText = "font-size: 13px; color: #888; margin-bottom: 5px; font-weight: bold;";
            dateDiv.textContent = `🕒 ${dateStr}`;

            const bodyP = document.createElement("p");
            bodyP.style.cssText = "margin: 0; font-size: 18px; color: #555; white-space: pre-wrap; line-height: 1.5;";
            bodyP.textContent = body;

            cardDiv.appendChild(dateDiv);
            cardDiv.appendChild(bodyP);
            container.appendChild(cardDiv);

        });
    }, (error) => {
        console.error("生徒側お知らせ取得エラー:", error);
    });
}
</script>

</body>


</html>
