<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <header>
    <h1 class="title">札幌国際情報高校　購買予約確認サイト</h1>
    <nav class="nav">
        <ul class="menu-group">
        <li class="menu-item"><a href="index.html">ホーム</a></li>
        <li class="menu-item"><a href="zaikokakunin.html">在庫確認</a></li>
        <li class="menu-item"><a href="toiawase.html">お問い合わせ</a></li>
        </ul>
    </nav>
    </header>

    <main>
    <div id="news-area" style="max-width: 800px; margin: 20px auto; padding: 0 15px; box-sizing: border-box; font-family: sans-serif;">
        <h2 style="font-size: 20px; color: #333; border-left: 5px solid #4169e1; padding-left: 10px; margin-bottom: 15px; text-align: left;">📢 購買からのお知らせ</h2>
        <div id="news-list-container" style="max-height:360px; overflow-y: auto; padding-right:5px;">
            <!-- ここに動的にお知らせのカードが追加されます -->
        </div>
    </div>

    <div class="fixed-button-container">
      <a href="foodhome.html" class="fixed-button">商品を予約する</a>
      <a href="zaiko.html" class="fixed-button">在庫を確認する</a>
    </div>
  </main>
  

      <footer>
     <div class="footer-content">
        <p><a href="https://www.sit.hokkaido-c.ed.jp/">札幌国際情報高校公式HP</a></p>
        <p><a href="login.html">管理者ログイン</a></p>
    <p>札幌国際情報高校30期理数工学科</p>
    </div>
</footer>

<script type="module">
 // 既存のFirebaseインポートに以下を追加（Realtime Databaseの機能）
import {initializeApp}from"https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getDatabase, ref, set, push, onDisconnect } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

const firebaseConfig = {
            apiKey: "AIzaSyBtLHgM6RzCU_grTElSqLCmsaRu4rVe-4o", 
            authDomain: "://firebaseapp.com", 
            projectId: "koubai-7b6a6", 
            storageBucket: "koubai-7b6a6.firebasetorage.app", 
            messagingSenderId: "934504714342", 
            appId: "1:934504714342:web:e160ada63fcfcd906c5da7"
        };

const app = initializeApp(firebaseConfig);
const rtdb = getDatabase(app);

// --- 🌐 オンライン滞在者の記録機能 ---
function trackPresence() {
    // ユーザーごとにランダムなユニークIDを発行して、しるしをつける
    const onlineUsersRef = ref(rtdb, 'online_users');
    const myUserRef = push(onlineUsersRef);

    // 1. ページを開いたとき：データベースに「値＝true」で自分を追加
    set(myUserRef, true);

    // 2. ページを閉じたとき（タブを閉じる、通信切断など）：自動的に自分のデータを削除する予約
    onDisconnect(myUserRef).remove();
}

// 実行する
trackPresence();

import { getFirestore, doc, updateDoc, increment, setDoc, getDoc, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const db = getFirestore(app); // 既存のdb初期化

// --- 📅 【新設】今日の訪問者数をカウントアップする機能 ---
async function countTodayView() {
    // すでにこのタブ（セッション）でカウント済みの場合はスキップして二重カウントを防ぐ
    if (sessionStorage.getItem('counted_today')) return;

    // 今日の日付を取得 (例: "2026-09-25")
    const today = new Date().toISOString().split('T')[0];
    const todayDocRef = doc(db, "analytics", today);

    try {
        // 今日初めてのアクセスならドキュメントを作成、すでに存在すればviewsを+1する
        const docSnap = await getDoc(todayDocRef);
        if (docSnap.exists()) {
            await updateDoc(todayDocRef, { views: increment(1) });
        } else {
            await setDoc(todayDocRef, { views: 1 });
        }
        
        // カウント済みフラグをセッションに保存
        sessionStorage.setItem('counted_today', 'true');
    } catch (error) {
        console.error("今日の訪問者数カウントアップエラー:", error);
    }
}

// 実行する
countTodayView();

function listenNewsUpdates() {
    const container = document.getElementById("news-list-container");
    if (!container) return;

    // 日付の新しい順（desc）に「news」コレクションを監視するクエリ
    const newsQuery = query(collection(db, "news"), orderBy("date", "desc"));

    onSnapshot(newsQuery, (querySnapshot) => {
        container.innerHTML = ""; // 一度初期化

        if (querySnapshot.empty) {
            container.innerHTML = `
                <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; text-align: center; color: #777; border: 1px dashed #ccc;">
                    現在、新しいお知らせはありません。
                </div>`;
            return;
        }

        querySnapshot.forEach((newsDoc) => {
            const data = newsDoc.data();
            const title = data.title || "無題";
            const body = data.body || "";
            
            // FirebaseのTimestampを「2026/10/16」形式の日付文字列に変換
            const dateStr = data.date ? data.date.toDate().toLocaleDateString('ja-JP',{
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            }) : "---";


            // 生徒向けの綺麗なカード型UIデザイン
            const cardHTML = `
                <div class="news-card" style="background: #ffffff; padding: 15px 20px; border-radius: 8px; box-shadow: 2px 2px 6px rgba(0,0,0,0.08); border-left: 5px solid #4169e1; margin-bottom: 12px; text-align: left;">
                    <div style="font-size: 13px; color: #888; margin-bottom: 5px; font-weight: bold;">🕒 ${dateStr}</div>
                    <p style="margin: 0; font-size: 18px; color: #555; white-space: pre-wrap; line-height: 1.5;">${body}</p>
                </div>
            `;
            container.innerHTML += cardHTML;
        });
    }, (error) => {
        console.error("生徒側お知らせ取得エラー:", error);
    });
}

// 実行する
listenNewsUpdates();



</script>

</body>


</html>
