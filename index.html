<script type="module">
 // 既存のFirebaseインポートに以下を追加（Realtime Databaseの機能）
import {initializeApp}from"https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { getDatabase, ref, set, push, onDisconnect } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";

const firebaseConfig = {
            apiKey: "AIzaSyBtLHgM6RzCU_grTElSqLCmsaRu4rVe-4o", 
            authDomain: "://firebaseapp.com", 
            projectId: "koubai-7b6a6", 
            storageBucket: "koubai-7b6a6.firebasetorage.app", 
            messagingSenderId: "934504714342", 
            appId: "1:934504714342:web:e160ada63fcfcd906c5da7"
        };

const app = initializeApp(firebaseConfig);
const rtdb = getDatabase(app);

// --- 🌐 オンライン滞在者の記録機能 ---
function trackPresence() {
    // ユーザーごとにランダムなユニークIDを発行して、しるしをつける
    const onlineUsersRef = ref(rtdb, 'online_users');
    const myUserRef = push(onlineUsersRef);

    // 1. ページを開いたとき：データベースに「値＝true」で自分を追加
    set(myUserRef, true);

    // 2. ページを閉じたとき（タブを閉じる、通信切断など）：自動的に自分のデータを削除する予約
    onDisconnect(myUserRef).remove();
}

// 実行する
trackPresence();

import { getFirestore, doc, updateDoc, increment, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

const db = getFirestore(app); // 既存のdb初期化

// --- 📅 【新設】今日の訪問者数をカウントアップする機能 ---
async function countTodayView() {
    // すでにこのタブ（セッション）でカウント済みの場合はスキップして二重カウントを防ぐ
    if (sessionStorage.getItem('counted_today')) return;

    // 今日の日付を取得 (例: "2026-09-25")
    const today = new Date().toISOString().split('T')[0];
    const todayDocRef = doc(db, "analytics", today);

    try {
        // 今日初めてのアクセスならドキュメントを作成、すでに存在すればviewsを+1する
        const docSnap = await getDoc(todayDocRef);
        if (docSnap.exists()) {
            await updateDoc(todayDocRef, { views: increment(1) });
        } else {
            await setDoc(todayDocRef, { views: 1 });
        }
        
        // カウント済みフラグをセッションに保存
        sessionStorage.setItem('counted_today', 'true');
    } catch (error) {
        console.error("今日の訪問者数カウントアップエラー:", error);
    }
}

// 実行する
countTodayView();

</script>
