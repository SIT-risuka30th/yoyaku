<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
    <title>購入履歴</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
    </head>
   <header>
    <h1 class="title">管理者ダッシュボード</h1>
    <nav class="nav">
        <ul class="menu-group">
        <li class="menu-item"><a href="index.html">ホーム</a></li>
        <li class="menu-item"><a href="rireki.html">購入履歴</a></li>
        <li class="menu-item"><a href="zaikokakunin.html">在庫確認</a></li>
        <li class="menu-item"><a href="https://docs.google.com/spreadsheets/d/1XDmbBjMA3AwlaBiqVhovvMnNDv-elaaaNoHIWIbCZvI/edit?gid=0#gid=0">在庫数変更</a>   </li>
        </ul>
    </nav>
    </header>
<body>

   <div class="history-container">
        <div class="back-link">
            <a href="dashboard.html">← ダッシュボードへ戻る</a>
        </div>
        
        <h1 class="page-title">過去の購入履歴一括ログ（全データ）</h1>
  
<div id="statusPlaceholder" class="status-message">⏳ Firestoreから履歴データを同期中</div>

 <div class="table-card" id="tableCard" style="display: none;">
            <table class="history-table">
                <thead>
                    <tr>
                        <th style="width: 15%;">注文日時</th>
                        <th style="width: 15%;">学年・クラス</th>
                        <th style="width: 10%;">番号</th>
                        <th style="width: 20%;">氏名</th>
                        <th style="width: 25%;">注文内訳</th>
                        <th style="width: 15%;">合計決済額</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody">
                    <!-- JavaScriptによってFirestoreのデータが注入されます -->
                </tbody>
            </table>
        </div>
    </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getFirestore, onSnapshot, collection, query, orderBy} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        // 1. ✅ 設定に databaseURL（本物のデータがある場所の住所）を追加
        const firebaseConfig = {
            apiKey: "AIzaSyBtLHgM6RzCU_grTElSqLCmsaRu4rVe-4o", 
            authDomain: "koubai-7b6a6.firebaseapp.com", 
            databaseURL:"koubai-7b6a6-default-rtdb.firebaseio.com",
            projectId: "koubai-7b6a6", 
            storageBucket: "koubai-7b6a6.firebasetorage.app", 
            messagingSenderId: "934504714342", 
            appId: "1:934504714342:web:e160ada63fcfcd906c5da7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.addEventListener('DOMContentLoaded', () => {
            const historyBody = document.getElementById("historyTableBody");
            const statusPlaceholder = document.getElementById("statusPlaceholder");
            const tableCard = document.getElementById("tableCard");
            
            if (!historyBody) return;

            try {
                // 自動インデックスと連携した高効率リアルタイム監視
                const historyQuery = query(collection(db, "orders"), orderBy("createdAt", "desc"));
                
                onSnapshot(historyQuery, (querySnapshot) => {
                    historyBody.textContent = ""; 
                    
                    if (querySnapshot.empty) {
                        if (statusPlaceholder) {
                            statusPlaceholder.style.display = "block";
                            statusPlaceholder.textContent = "📂 購入履歴データはまだ登録されていません。";
                        }
                        if (tableCard) tableCard.style.display = "none";
                        return;
                    }

                    if (statusPlaceholder) statusPlaceholder.style.display = "none";
                    if (tableCard) tableCard.style.display = "block";

                    querySnapshot.forEach((doc) => {
                        const data = doc.data();
                        const gakunen = data.gakunen || "";
                        const className = data.className || "";
                        const number = data.number || "-";
                        const name = data.name || "不明";
                        const items = data.items || data.details || "なし";
                        const totalPrice = data.totalPrice ? data.totalPrice.toLocaleString() + "円" : "0円";
                        
                        let dateStr = "---";
                        if (data.createdAt && typeof data.createdAt.toDate === "function") {
                            dateStr = data.createdAt.toDate().toLocaleDateString('ja-JP', {
                                month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
                            });
                        }

                        const tr = document.createElement("tr");
                        
                        if (data.isDeleted === true) {
                            tr.className = "status-deleted";
                        }

                        tr.innerHTML = `
                            <td style="color: #666;">${dateStr}</td>
                            <td>${gakunen}年${className}組</td>
                            <td>${number}番</td>
                            <td class="name-cell">${name}</td>
                            <td style="color: #4c566a; font-size: 14px; max-width: 350px; word-wrap: break-word;">${items}</td>
                            <td class="price-cell">${totalPrice}</td>
                        `;
                        historyBody.appendChild(tr);
                    });
                    console.log("履歴データの読み込みと画面反映に成功しました。");
                }, (error) => {
                    console.error("履歴データ同期エラー:", error);
                    if (statusPlaceholder) {
                        statusPlaceholder.className = "status-message status-error";
                        statusPlaceholder.textContent = "❌ データのロード権限がありません。ルール設定を確認してください。";
                    }
                    if (tableCard) tableCard.style.display = "none";
                });
            } catch (error) {
                console.error("初期化時クラッシュ:", error);
            }
        });
</script>
</body>
</html>
