<body>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getFirestore, onSnapshot, collection, query, orderBy} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        // 1. ✅ 設定に databaseURL（本物のデータがある場所の住所）を追加

            apiKey: "AIzaSyBtLHgM6RzCU_grTElSqLCmsaRu4rVe-4o", 
            authDomain: "koubai-7b6a6.firebaseapp.com", 
            databaseURL:"koubai-7b6a6-default-rtdb.firebaseio.com",
            projectId: "koubai-7b6a6", 
            storageBucket: "koubai-7b6a6.firebasetorage.app", 
            messagingSenderId: "934504714342",

        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

window.addEventListener('DOMContentLoaded', async () => {
    const historyBody = document.getElementById("historyTableBody") || document.querySelector("tbody");
    if (!historyBody) return;

     try {
        console.log("購入履歴の読み込みを開始します...");
        
      onSnapshot(historyQuery, (querySnapshot) => {
            historyBody.textContent = ""; 

            if (querySnapshot.empty) {
                historyBody.innerHTML = `<tr><td colspan="6" style="padding: 20px; text-align: center; color: #999;">購入履歴データはありません。</td></tr>`;
                return;
            }

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const gakunen = data.gakunen || "";
                const className = data.className || "";
                const number = data.number || "-";
                const name = data.name || "不明";
                const items = data.items || data.details || "なし";
                const totalPrice = data.totalPrice ? data.totalPrice.toLocaleString() + "円" : "0円";
                
                let dateStr = "---";
                if (data.createdAt && typeof data.createdAt.toDate === "function") {
                    dateStr = data.createdAt.toDate().toLocaleDateString('ja-JP', {
                        month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
                    });
                }

            const tr = document.createElement("tr");
                tr.style.borderBottom = "1px solid #eee";
          
                
                 if (data.isDeleted === true) {
                    tr.style.opacity = "0.6";
                    tr.style.backgroundColor = "#fdf2f2";
                }

                tr.innerHTML = `
                    <td style="padding: 12px 10px; color: #555;">${dateStr}</td>
                    <td style="padding: 12px 10px; color: #555;">${gakunen}年${className}組</td>
                    <td style="padding: 12px 10px; color: #555;">${number}番</td>
                    <td style="padding: 12px 10px; font-weight: bold; color: #333;">${name}</td>
                    <td style="padding: 12px 10px; color: #666; font-size: 14px;">${items}</td>
                    <td style="padding: 12px 10px; font-weight: bold; color: #e67e22;">${totalPrice}</td>
                `;
                historyBody.appendChild(tr);
            });
            console.log("購入履歴の読み込みが正常に完了しました。");
        }, (error) => {
            console.error("履歴データの取得に失敗しました(Snapshot):", error);
            historyBody.innerHTML = `<tr><td colspan="6" style="padding: 20px; text-align: center; color: red;">データの読込権限またはインデックスを確認してください。</td></tr>`;
        });
    } catch (error) {
        console.error("履歴処理クラッシュ:", error);
        historyBody.innerHTML = `<tr><td colspan="6" style="padding: 20px; text-align: center; color: red;">プログラムのエラーが発生しました。</td></tr>`;
    }
});
</script>
