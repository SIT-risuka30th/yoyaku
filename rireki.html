<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
    <title>購入履歴</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
    </head>
   <header>
    <h1 class="title">管理者ダッシュボード</h1>
    <nav class="nav">
        <ul class="menu-group">
        <li class="menu-item"><a href="index.html">ホーム</a></li>
        <li class="menu-item"><a href="rireki.html">購入履歴</a></li>
        <li class="menu-item"><a href="zaikokakunin.html">在庫確認</a></li>
        <li class="menu-item"><a href="https://docs.google.com/spreadsheets/d/1XDmbBjMA3AwlaBiqVhovvMnNDv-elaaaNoHIWIbCZvI/edit?gid=0#gid=0">在庫数変更</a>   </li>
        </ul>
    </nav>
    </header>
<body>

  <h2><a href="dashboard.html">ダッシュボードに戻る</a></h2>
  <h1>【管理者用】過去の購入履歴一覧</h1>
  
<div id="table-container">
        <div id="loading" class="loading">Firestoreから履歴を読み込み中...</div>
    </div>


    <style>
    body { font-family: sans-serif; margin: 30px; background-color: #f8f9fa; }
    h1 { color: #333; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    th { background-color: #28a745; color: white; } /* 管理者用として緑基調にしています */
    tr:nth-child(even) { background-color: #f2f2f2; }
    .loading { font-size: 18px; color: #666; }
  </style>


  <script type="module">
 import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
        import { getFirestore, collection, query, where, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        // 1. ✅ 設定に databaseURL（本物のデータがある場所の住所）を追加
        const firebaseConfig = {
            apiKey: "AIzaSyBtLHgM6RzCU_grTElSqLCmsaRu4rVe-4o", 
            authDomain: "koubai-7b6a6.firebaseapp.com", 
            databaseURL: "https://firebahttps://koubai-7b6a6-default-rtdb.firebaseio.com/seio.com",
            projectId: "koubai-7b6a6", 
            storageBucket: "koubai-7b6a6.firebasetorage.app", 
            messagingSenderId: "934504714342", 
            appId: "1:934504714342:web:e160ada63fcfcd906c5da7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app); 
        const rtdb = getDatabase(app); // 👈 db(Firestore) をやめて rtdb(Realtime Database) に変更します

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                console.log("履歴ページ接続完了。UID:", user.uid);
                
                const container = document.getElementById("table-container");
                if (!container) return;

                // 2. 🛡️ Realtime Database（rtdb）の 'orders' の場所を指定
                const ordersRef = ref(rtdb, 'orders');

                // 3. 🛡️ onSnapshot ではなく、Realtime Database用の onValue でリアルタイム監視を開始
                onValue(ordersRef, (snapshot) => {
                    container.textContent = ""; // 画面を一度クリア（安全なクリア方法）

                    // 履歴データが存在しない場合の処理
                    if (!snapshot.exists()) {
                        const noDataDiv = document.createElement("div");
                        noDataDiv.className = "no-data";
                        noDataDiv.textContent = "過去のご注文履歴はありません。";
                        container.appendChild(noDataDiv);
                        return;
                    }

                    const data = snapshot.val();
                    
                    // 🚨 【セキュリティ対策・プライバシー保護】 
                    // 届いたすべての注文データの中から、「今ログインしているこの生徒のUID」と一致するものだけを安全に抽出します
                    // 💡 履歴を新しい順（下から上）に並べるため、キー配列を逆順にします
                    const myOrderKeys = Object.keys(data).reverse().filter(key => data[key].userId === user.uid);

                    // 自分の注文データが1件もない場合
                    if (myOrderKeys.length === 0) {
                        const noDataDiv = document.createElement("div");
                        noDataDiv.className = "no-data";
                        noDataDiv.textContent = "過去のご注文履歴はありません。";
                        container.appendChild(noDataDiv);
                        return;
                    }

                    // 4. 🔒 【最重要・XSS完全対策】 innerHTML を一切使わず、DOM API（createElement）だけでテーブルを組み立てます
                    const table = document.createElement("table");
                    const thead = document.createElement("thead");
                    const tbody = document.createElement("tbody");

                    // ヘッダー行の組み立て
                    const headerRow = document.createElement("tr");
                    ["注文日時", "お名前", "注文内容", "ステータス"].forEach(text => {
                        const th = document.createElement("th");
                        th.textContent = text;
                        headerRow.appendChild(th);
                    });
                    thead.appendChild(headerRow);
                    table.appendChild(thead);

                    // 自分のデータだけを1行ずつ安全にテーブルへ追加していく
                    myOrderKeys.forEach((docId) => {
                        const order = data[docId];
                        if (order.isDeleted === true) return; // 管理画面で削除（非表示）にされた注文は出さない

                        const tr = document.createElement("tr");

                        // ① 注文日時の処理
                        const tdDate = document.createElement("td");
                        let dateStr = "---";
                        // Realtime Databaseに保存されている文字形式の日付、またはタイムスタンプに対応
                        if (order.orderDate) {
                            dateStr = new Date(order.orderDate).toLocaleString('ja-JP', {
                                year: 'numeric', month: '2-digit', day: '2-digit',
                                hour: '2-digit', minute: '2-digit'
                            });
                        } else if (order.createdAt) {
                            dateStr = new Date(order.createdAt).toLocaleString('ja-JP');
                        }
                        tdDate.textContent = dateStr; // ✅ textContent で安全に挿入

                        // ② お名前の処理
                        const tdName = document.createElement("td");
                        const strongName = document.createElement("strong");
                        strongName.textContent = order.name || "未入力"; // ✅ 安全に文字として挿入
                        tdName.appendChild(strongName);

                        // ③ 注文内容の処理
                        const tdItems = document.createElement("td");
                        tdItems.style.cssText = "font-size: 14px; max-width: 300px; word-wrap: break-word;";
                        tdItems.textContent = order.items || "なし"; // ✅ 生徒の自由入力（items）を100%安全に文字化（XSSを完全無効化）

                        // ④ ステータスの処理
                        const tdStatus = document.createElement("td");
                        let statusText = "⏳ 受付中";
                        if (order.status === "completed") statusText = "✅ 渡済";
                        tdStatus.textContent = statusText;

                        // 各パーツを1つの行に合体
                        tr.appendChild(tdDate);
                        tr.appendChild(tdName);
                        tr.appendChild(tdItems);
                        tr.appendChild(tdStatus);
                        tbody.appendChild(tr);
                    });

                    table.appendChild(tbody);
                    container.appendChild(table); // 最後に安全に組み立てたテーブルを一括反映

                }, (error) => {
                    console.error("購入履歴の読み込みエラー:", error);
                    if (container) {
                        container.textContent = "";
                        const errorDiv = document.createElement("div");
                        errorDiv.className = "no-data";
                        errorDiv.style.color = "red";
                        errorDiv.textContent = "履歴の読み込みに失敗しました。";
                        container.appendChild(errorDiv);
                    }
                });

            } else {
                try {
                    await signInAnonymously(auth);
                } catch (error) {
                    console.error("匿名ログイン失敗:", error);
                }
            }
        });

         </script>
</body>
</html>
