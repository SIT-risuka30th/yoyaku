<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
    <title>購入履歴</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
    </head>
   <header>
    <h1 class="title">管理者ダッシュボード</h1>
    <nav class="nav">
        <ul class="menu-group">
        <li class="menu-item"><a href="index.html">ホーム</a></li>
        <li class="menu-item"><a href="rireki.html">購入履歴</a></li>
        <li class="menu-item"><a href="zaikokakunin.html">在庫確認</a></li>
        <li class="menu-item"><a href="https://docs.google.com/spreadsheets/d/1XDmbBjMA3AwlaBiqVhovvMnNDv-elaaaNoHIWIbCZvI/edit?gid=0#gid=0">在庫数変更</a>   </li>
        </ul>
    </nav>
    </header>
<body>

  <h2><a href="dashboard.html">ダッシュボードに戻る</a></h2>
  <h1>【管理者用】過去の購入履歴一覧</h1>
  
<div id="table-container">
        <div id="loading" class="loading">Firestoreから履歴を読み込み中...</div>
    </div>


    <style>
    body { font-family: sans-serif; margin: 30px; background-color: #f8f9fa; }
    h1 { color: #333; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    th { background-color: #28a745; color: white; } /* 管理者用として緑基調にしています */
    tr:nth-child(even) { background-color: #f2f2f2; }
    .loading { font-size: 18px; color: #666; }
  </style>


  <script type="module">
 import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
        import { getFirestore, collection, query, where, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBtLHgM6RzCU_grTElSqLCmsaRu4rVe-4o", 
            authDomain: "koubai-7b6a6.firebaseapp.com", 
            projectId: "koubai-7b6a6", 
            storageBucket: "koubai-7b6a6.firebasetorage.app", 
            messagingSenderId: "934504714342", 
            appId: "1:934504714342:web:e160ada63fcfcd906c5da7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app); 
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                console.log("履歴ページ接続完了。UID:", user.uid);
                
                // 🔑 自分のUIDの注文データだけを絞り込んで取得するクエリ
                const historyQuery = query(
                    collection(db, "orders"),
                    where("userId", "==", user.uid),
                    orderBy("orderDate", "desc")
                );

                const container = document.getElementById("table-container");

                // リアルタイムに履歴を監視して画面に出す
                onSnapshot(historyQuery, (querySnapshot) => {
                    if (!container) return;

                    // 履歴が空っぽだった場合の処理
                    if (querySnapshot.empty) {
                        container.innerHTML = `<div class="no-data">過去のご注文履歴はありません。</div>`;
                        return;
                    }

                    // 💡 テーブルの骨組みを生成
                    let tableHTML = `
                        <table>
                            <thead>
                                <tr>
                                    <th>注文日時</th>
                                    <th>お名前</th>
                                    <th>注文内容</th>
                                    <th>ステータス</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    // 届いたデータを1行ずつ組み立てる
                    querySnapshot.forEach((docSnap) => {
                        const order = docSnap.data();
                        
                        // タイムスタンプを読みやすい日付文字列に変換
                        let dateStr = "---";
                        if (order.orderDate) {
                            dateStr = order.orderDate.toDate().toLocaleString('ja-JP', {
                                year: 'numeric', month: '2-digit', day: '2-digit',
                                hour: '2-digit', minute: '2-digit'
                            });
                        } else if (order.createdAt) { // 予備でcreatedAtも判定
                            dateStr = order.createdAt.toDate().toLocaleString('ja-JP');
                        }

                        const name = order.name || "未入力";
                        const items = order.items || "なし";
                        
                        // ステータスの日本語化
                        let statusText = "受付中";
                        if (order.status === "pending") statusText = "⏳ 受付中";
                        if (order.status === "completed") statusText = "✅ 渡済";

                        tableHTML += `
                            <tr>
                                <td>${dateStr}</td>
                                <td><strong>${name}</strong></td>
                                <td style="font-size: 14px; max-width: 300px; word-wrap: break-word;">${items}</td>
                                <td>${statusText}</td>
                            </tr>
                        `;
                    });

                    tableHTML += `
                            </tbody>
                        </table>
                    `;

                    // 画面に一括で反映（これで「読み込み中...」が消えます）
                    container.innerHTML = tableHTML;

                }, (error) => {
                    console.error("購入履歴の読み込みエラー:", error);
                    if (container) {
                        container.innerHTML = `<div class="no-data" style="color: red;">履歴の読み込みに失敗しました。</div>`;
                    }
                });

            } else {
                try {
                    await signInAnonymously(auth);
                } catch (error) {
                    console.error("匿名ログイン失敗:", error);
                }
            }
        }); 
         </script>
</body>
</html>
