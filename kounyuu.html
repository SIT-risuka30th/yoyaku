<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>札幌国際情報高校購買予約サイト</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
</head>
<body class="reserve">
    <header>
    <h1 class="title">札幌国際情報高校　購買予約確認サイト</h1>
    <nav class="nav">
        <ul class="menu-group">
        <li class="menu-item"><a href="index.html">ホーム</a></li>
        <li class="menu-item"><a href="zaikokakunin.html">在庫確認</a></li>
        <li class="menu-item"><a href="toiawase.html">お問い合わせ</a></li>
        </ul>
    </nav>
    </header>


    
    <div class="container">
        <h2>購入情報</h2>
        
      
        <table class="data-table">
            <thead>
                <tr>
                    <th>データ元</th>
                    <th>入力された内容</th>
                    <th>金額</th>
                </tr>
            </thead>
            <tbody>
                <tr id="rowName">
                    <td>メロンパン</td>
                    <td id="displayName" class="data-text">未入力</td>
                    <td id="priceName" class="price-text">0円</td>
                </tr>
                <tr id="rowMsg">
                    <td>おにぎり</td>
                    <td id="displayMsg" class="data-text">未入力</td>
                    <td id="priceMsg" class="price-text">0円</td>
                </tr>
                <tr id="row1">
                    <td>チョコブラウニー</td>
                    <td id="display1" class="data-text">未入力</td>
                    <td id="price1" class="price-text">0円</td>
                </tr>
                <tr id="rowD1">
                    <td>きりっと果実</td>
                    <td id="displayD1" class="data-text">未入力</td>
                    <td id="priceD1" class="price-text">0円</td>
                </tr>
                <tr id="rowD2">
                    <td>キリンメッツライチ</td>
                    <td id="displayD2" class="data-text">未入力</td>
                    <td id="priceD2" class="price-text">0円</td>
                </tr>
                <tr id="rowD3">
                    <td>きりっと果実スカッシュ</td>
                    <td id="displayD3" class="data-text">未入力</td>
                    <td id="priceD3" class="price-text">0円</td>
                </tr>
            </tbody>
        </table>

        <div class="total-box">
            合計金額:<span id="totalPrice">0</span>円
        </div>

        <!-- 入力フォーム -->
        <div class="mail-form">
            <p>氏名：<input type="text" id="yourname" required></p>
            <p>
                学年：
                <select id="gakunen">
                    <option value="1年">1年</option>
                    <option value="2年">2年</option>
                    <option value="3年">3年</option>
                </select>
            </p>
            <p>
                クラス：
                <select id="class">
                    <option value="1組">1組</option>
                    <option value="2組">2組</option>
                    <option value="3組">3組</option>
                    <option value="4組">4組</option>
                    <option value="5組">5組</option>
                    <option value="6組">6組</option>
                    <option value="7組">7組</option>
                    <option value="8組">8組</option>
                </select>
            </p>
        </div>

        <div class="form-group">
    <label for="shusshkiNumber">出席番号:</label>
    <input type="number" id="shusshkiNumber" placeholder="例: 15" min="1">
</div>

<div class="form-group">
    <label for="userPin">暗証番号（自分で決める4桁）:</label>
    <!-- 数字4桁の伏せ字入力欄 -->
    <input type="password" id="userPin" placeholder="初回に決めた4桁の数字" maxlength="4" pattern="\d{4}">
    <small style="color: gray; display: block;">※初めてこの番号を使う際に入力した番号が、あなた専用のパスワードになります。</small>
</div>

        <!-- メール送信ボタン -->
        <button id="mailBtn" class="btn-submit">✉️ 注文データを送信</button>

        <button id="clearBtn" class="btn-clear">データをすべて消去</button>
        <p><a href="foodhome.html">商品ページへ戻る</a></p>
    </div>




    <style>
        body { font-family: sans-serif; padding: 20px; background: #fafafa; }
        .container { max-width: 500px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin: 0 auto; }
        
        /* テーブルのスタイル */
        .data-table { width: 100%; border-collapse: collapse; margin-top: 15px; margin-bottom: 25px; font-size: 14px; }
        .data-table th, .data-table td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        .data-table th { background-color: #f2f2f2; font-weight: bold; width: 40%; }
        .data-text { background-color: #fdfdfd; font-weight: bold; color: #333; }
        .price-text{ text-align:right; font-weight:bold; color: #D9534f;}

        .total-box{background:#fff3cd; color:#856404; padding:15px; border-radius:6px; text-align:right; font-size:18px; font-weight:bold; margin-bottom:25px;border:1px solid #ffeeba;}
        /* フォームとボタンのスタイル */
        .mail-form { background: #f9f9f9; padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #eee; }
        .mail-form p { margin: 10px 0; }
        input[type="text"], select { padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 12px; margin-top: 10px; font-size: 16px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; }
        .btn-mail { background: #007bff; color: white; }
        .btn-mail:hover { background: #0056b3; }
        .btn-clear { background: #dc3545; color: white; margin-top: 30px; font-size: 12px; padding: 6px; }
    </style>

    <script type="module">
       // 1. FirebaseとFirestoreの初期化
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import {getFirestore, collection, addDoc, serverTimestamp, doc, setDoc, updateDoc, increment, getDoc, query, where, onSnapshot} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
    import {getDatabase, ref, set, push, onDisconnect } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";



    const firebaseConfig = {
        apiKey: "AIzaSyBtLHgM6RzCU_grTElSqLCmsaRu4rVe-4o", 
        authDomain: "koubai-7b6a6.firebaseapp.com", 
        projectId: "koubai-7b6a6", 
        storageBucket: "koubai-7b6a6.firebasetorage.app", 
        messagingSenderId: "934504714342", 
        appId: "1:934504714342:web:e160ada63fcfcd906c5da7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const rtdb = getDatabase(app);
  

    let myOrdersListener = null;



   function trackPresence() {
        const onlineUsersRef = ref(rtdb, 'online_users');
        const myUserRef = push(onlineUsersRef);
        set(myUserRef, true);
        onDisconnect(myUserRef).remove();
    }
    trackPresence();

    // --- 📅 ② 今日の訪問者数をカウントアップする機能 ---
    async function countTodayView() {
        if (sessionStorage.getItem('counted_today')) return;
        const today = new Date().toISOString().split('T')[0]; // "2026-09-25" 形式
        const todayDocRef = doc(db, "analytics", today);
        try {
            const docSnap = await getDoc(todayDocRef);
            if (docSnap.exists()) {
                await updateDoc(todayDocRef, { views: increment(1) });
            } else {
                await setDoc(todayDocRef, { views: 1 });
            }
            sessionStorage.setItem('counted_today', 'true');
        } catch (error) {
            console.error("今日の訪問者数カウントアップエラー:", error);
        }
    }
    countTodayView();

  
   

    // 2. 商品の単価設定
    const PRICE_A = 160;
    const PRICE_B = 180;
    const PRICE_C = 140;
    const PRICE_D1 = 180;
    const PRICE_D2 = 180;
    const PRICE_D3 = 150;

    // 3. 表示と非表示、テキスト代入をまとめた関数
    function handleRow(rowId, countId, priceId, count, price) {
        const rowElement = document.getElementById(rowId);
        if (!rowElement) return;

        if (count === 0) {
            rowElement.style.display = 'none';
        } else {
            rowElement.style.display = '';
            document.getElementById(countId).textContent = count + "個";
            document.getElementById(priceId).textContent = price.toLocaleString() + "円";
        }
    }

    // 4. ローカルストレージから個数を取得
    const rawA = localStorage.getItem('inputName') || "";
    const rawB = localStorage.getItem('inputMsg') || "";
    const rawC = localStorage.getItem('input1') || "";
    const rawD1 = localStorage.getItem('inputD1') || "";
    const rawD2 = localStorage.getItem('inputD2') || "";
    const rawD3 = localStorage.getItem('inputD3') || "";

    const savedName = parseInt(rawA.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 65248)), 10) || 0;
    const savedMsg = parseInt(rawB.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 65248)), 10) || 0;
    const saved1 = parseInt(rawC.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 65248)), 10) || 0;
    const savedD1 = parseInt(rawD1.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 65248)), 10) || 0;
    const savedD2 = parseInt(rawD2.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 65248)), 10) || 0;
    const savedD3 = parseInt(rawD3.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 65248)), 10) || 0;

    const totalA = savedName * PRICE_A;
    const totalB = savedMsg * PRICE_B;
    const totalC = saved1 * PRICE_C;
    const totalD1 = savedD1 * PRICE_D1;
    const totalD2 = savedD2 * PRICE_D2;
    const totalD3 = savedD3 * PRICE_D3;

    handleRow('rowName', 'displayName', 'priceName', savedName, totalA);
    handleRow('rowMsg', 'displayMsg', 'priceMsg', savedMsg, totalB);
    handleRow('row1', 'display1', 'price1', saved1, totalC);
    handleRow('rowD1', 'displayD1', 'priceD1', savedD1, totalD1);
    handleRow('rowD2', 'displayD2', 'priceD2', savedD2, totalD2);
    handleRow('rowD3', 'displayD3', 'priceD3', savedD3, totalD3);

    const totalPriceEl = document.getElementById('totalPrice');
    if (totalPriceEl) {
        totalPriceEl.textContent = (totalA + totalB + totalC + totalD1 + totalD2 + totalD3).toLocaleString();
    }

    // 5. 📤 注文データ送信処理（Googleアカウント紐付け対応版）
     const mailBtn = document.getElementById('mailBtn');
    if (mailBtn) {
        mailBtn.addEventListener('click', async () => {
            const allTotal = totalA + totalB + totalC + totalD1 + totalD2 + totalD3;

            if (allTotal === 0) {
                alert("商品が選択されていません。個数を入力してください。");
                return;
            }

            const nameInput = document.getElementById('yourname').value.trim();
            const gakunenInput = document.getElementById('gakunen').value.trim();
            const classInput = document.getElementById('class').value.trim();
            const numberInput = document.getElementById('shusshkiNumber').value.trim(); 
            const pinInput = document.getElementById('userPin').value.trim(); 

            if (!gakunenInput || !classInput || !numberInput) {
                alert("学年、クラス、出席番号を入力してください。");
                return;
            }

            if (!nameInput) {
                alert("氏名を入力してください。");
                return;
            }

            if (!pinInput || pinInput.length < 4) {
                alert("4桁の暗証番号を入力してください。");
                return;
            }

            const userKey = `${gakunenInput}-${classInput}-${numberInput}`;
            const userDocRef = doc(db, "users", userKey);

            try {
                const userSnap = await getDoc(userDocRef);

                if (userSnap.exists()) {
                    const registeredPin = userSnap.data().pin;
                    if (pinInput !== registeredPin) {
                        alert("暗証番号が正しくありません。他人の名前・番号で注文することはできません。");
                        return; 
                    }
                } else {
                    await setDoc(userDocRef, {
                        gakunen: gakunenInput,
                        className: classInput,
                        number: numberInput,
                        name: nameInput,
                        pin: pinInput,
                        createdAt: serverTimestamp()
                    });
                    alert("【初回確認】この番号の暗証番号として登録しました。次回以降も同じ暗証番号を入力してください。");
                }

                let itemDetails = "";
                if (savedName > 0) itemDetails += `メロンパン:${savedName}個`;
                if (savedMsg > 0) itemDetails += `おにぎり:${savedMsg}個`;
                if (saved1 > 0) itemDetails += `チョコブラウニー:${saved1}個`;
                if (savedD1 > 0) itemDetails += `きりっと果実:${savedD1}個`;
                if (savedD2 > 0) itemDetails += `キリンメッツライチ:${savedD2}個`;
                if (savedD3 > 0) itemDetails += `きりっと果実スカッシュ:${savedD3}個`;

                await addDoc(collection(db, "orders"), {
                    gakunen: gakunenInput,
                    className: classInput,
                    number: numberInput,
                    name: nameInput,
                    items: itemDetails,       
                    totalPrice: allTotal,     
                    userId: userKey, 
                    userEmail: "guest@example.com",   
                    createdAt: serverTimestamp() 
                });

                alert("注文データを送信しました！購買でお持ちしています。");
                document.getElementById('yourname').value = ""; 
                document.getElementById('userPin').value = ""; 

            } catch (error) {
                console.error("データ送信・認証エラー:", error);
                alert("送信または認証に失敗しました。");
            }
        });
    }

    // 6. データクリアボタンの処理
    const clearBtn = document.getElementById('clearBtn');
    if (clearBtn) {
        clearBtn.addEventListener('click', () => {
            const itemsToClear = ['inputName', 'inputMsg', 'input1', 'inputD1', 'inputD2', 'inputD3'];
            itemsToClear.forEach(key => localStorage.removeItem(key));
            location.reload();
        });
    }
</script>
</body>
</html>
