<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者ログイン</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <h2>管理者ログイン</h2>
        <!-- JSで処理するため、formの送信を制御します -->
        <form id="loginForm">
            <div class="input-group">
                <label for="email">管理者ID(メールアドレス)</label>
                <input type="email" id="email" required>
            </div>
            <div class="input-group">
                <label for="password">パスワード</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn">ログイン</button>
        </form>
        <p id="errorMessage" class="error"></p>
    </div>


    <script type="module">

     import{initializeApp}from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
     import{getAuth,signInWithEmailAndPassword}from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
     import{getAnalytics}from "https://www.gstatic.com/firebasejs/11.0.0/firebase-analytics.js";
        // あなたのFirebase設定（ここはご自身のものに書き換えてください）
      const firebaseConfig = {
     apiKey: "AIzaSyBtLHgM6RzCU_grTElSqLCmsaRu4rVe-4o", 
      authDomain: "koubai-7b6a6.firebaseapp.com", 
      projectId: "koubai-7b6a6", 
      storageBucket: "koubai-7b6a6.firebasetorage.app", 
      messagingSenderId: "934504714342", 
      appId: "1:934504714342:web:e160ada63fcfcd906c5da7", 
      measurementId: "G-57V67C28RK"
     };

     const app = initializeApp(firebaseConfig);
     const auth = getAuth(app);
     const analytics = getAnalytics(app);

     

        // ログインフォームの処理
        const loginForm = document.getElementById("loginForm");
        if (loginForm) {
            loginForm.addEventListener("submit", (e) => {
                e.preventDefault();

                const email = document.getElementById("email").value;
                const password = document.getElementById("password").value;

                // ログインチェックを実行
               signInWithEmailAndPassword(auth,email,password)
                    .then((userCredential) => {
                        alert("ログインに成功しました！");
                        window.location.href = "dashboard.html"; // ダッシュボードへ移動
                    })
                    .catch((error) => {
                        console.error("エラーコード:", error.code);
                        document.getElementById("errorMessage").textContent = "IDまたはパスワードが違います。";
                    });
            });
        }
    </script>
</body>
</html>
