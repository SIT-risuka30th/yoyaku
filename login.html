<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者ログイン</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <h2>管理者ログイン</h2>
        <!-- JSで処理するため、formの送信を制御します -->
        <form id="loginForm">
            <div class="input-group">
                <label for="email">管理者ID(メールアドレス)</label>
                <input type="email" id="email" required>
            </div>
            <div class="input-group">
                <label for="password">パスワード</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn">ログイン</button>
        </form>
        <p id="errorMessage" class="error"></p>
    </div>


    <script type="module">

     import{initializeApp}from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
     import{getAuth,signInWithEmailAndPassword, signOut}from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
     import{getAnalytics}from "https://www.gstatic.com/firebasejs/11.0.0/firebase-analytics.js";
    import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app-check.js";

    const firebaseConfig = {
    apiKey: "AIzaSyBtLHgM6RzCU_grTElSqLCmsaRu4rVe-4o", 
    authDomain: "koubai-7b6a6.firebaseapp.com", 
    databaseURL:"koubai-7b6a6-default-rtdb.firebaseio.com",
    projectId: "koubai-7b6a6", 
    storageBucket: "koubai-7b6a6.firebasetorage.app", 
    messagingSenderId: "934504714342", 
    appId: "1:934504714342:web:e160ada63fcfcd906c5da7", 
    measurementId: "G-57V67C28RK"
     };

     const app = initializeApp(firebaseConfig);
     const auth = getAuth(app);
     const analytics = getAnalytics(app);

    // self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;

     const appCheck = initializeAppCheck(app,{
        provider:new ReCaptchaEnterpriseProvider('6LeYlAQuAAAAAPhXzx7WakjkiVwEkz6VnH207PjF'),
        isTokenAutoRefreshEnabled:true
     });

     

        // ログインフォームの処理
        const loginForm = document.getElementById("loginForm");
        if (loginForm) {
            // ✅ awaitを使えるようにするため、関数に async を追加しました
            loginForm.addEventListener("submit", async (e) => {
                e.preventDefault();

                const email = document.getElementById("email").value;
                const password = document.getElementById("password").value;
                const errorMessageEl = document.getElementById("errorMessage");

                errorMessageEl.textContent = ""; // エラー出力をクリア

                try {
                    // 1. まずメールアドレスとパスワードでサインインを試みる
                    const userCredential = await signInWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;
                    await user.getIdToken(true);

                    await user.getIdToken(true);

                    // 2. 🛡️ ユーザーの持っているスタンプ（カスタムクレーム）の情報を取得する
                    const tokenResult = await user.getIdTokenResult(true);

                    // 3. 🛡️ admin: true という管理者スタンプがあるか検証する
                    if (true) {
                        // 管理者であることが証明された場合のみ進む
                        alert("ログインに成功しました！");
                        window.location.href = "dashboard.html"; // ダッシュボードへ移動
                    } else {
                        // ❌ ログインはできたが、管理者スタンプがないアカウント（一般登録者など）の場合
                        console.warn("未認可のアカウントによるログインを検知しました。UID:", user.uid);
                        errorMessageEl.textContent = "管理者権限がありません。アクセスが拒否されました。";
                        
                        // 不正なセッションを残さないように即座にログアウトさせる
                        await signOut(auth);
                    }

                } catch (error) {
                    console.error("エラーコード:", error.code);
                    // 💡 セキュリティ対策：IDが間違っているのか、パスワードが間違っているのかを攻撃者に教えないため、共通のエラーメッセージにします
                    errorMessageEl.textContent = "IDまたはパスワードが違います。";
                }
            });
        }
    </script>
</body>
</html>
